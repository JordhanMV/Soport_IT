name: Publish Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to publish or repair, for example v1.1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Ensure updater files are attached to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          $installers = @(Get-ChildItem release -File | Where-Object { $_.Name -match '\.exe$' })
          $blockmaps = @(Get-ChildItem release -File | Where-Object { $_.Name -match '\.exe\.blockmap$' })
          $metadata = @(Get-ChildItem release -File | Where-Object { $_.Name -eq 'latest.yml' })
          if ($metadata.Count -ne 1) {
            throw 'The latest.yml updater metadata was not generated.'
          }
          if ($installers.Count -ne 1 -or $blockmaps.Count -ne 1) {
            throw 'The Windows installer was not generated.'
          }
          $version = $env:RELEASE_TAG -replace '^v', ''
          $installerName = "Inventario-de-soporte-Setup-$version.exe"
          $installerPath = Join-Path $installers[0].DirectoryName $installerName
          $blockmapPath = "$installerPath.blockmap"
          Rename-Item -LiteralPath $installers[0].FullName -NewName $installerName
          Rename-Item -LiteralPath $blockmaps[0].FullName -NewName "$installerName.blockmap"
          $assetPaths = @(
            $installerPath
            $blockmapPath
            $metadata[0].FullName
          )
          gh release upload $env:RELEASE_TAG @assetPaths --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
